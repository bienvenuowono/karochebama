# Fichier : devops/apache/vhost.conf
# Configuration Apache VPS - Reverse Proxy et Hosting Statique pour KAROCHEBAMA

<VirtualHost *:80>
    ServerName api.karochebama.local
    ServerAlias www.api.karochebama.local
    Redirect permanent / https://api.karochebama.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.karochebama.local
    
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.karochebama.local/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.karochebama.local/privkey.pem
    
    # Paramètres SSL recommandés
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # Compression Gzip/Deflate
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json

    # Headers de sécurité globaux
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "no-referrer-when-downgrade"

    # Reverse proxy vers le backend Node.js exécuté par PM2 (port 5000)
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog ${APACHE_LOG_DIR}/karochebama-api-error.log
    CustomLog ${APACHE_LOG_DIR}/karochebama-api-access.log combined
</VirtualHost>

# VirtualHost pour l'application Frontend Client
<VirtualHost *:80>
    ServerName client.karochebama.local
    Redirect permanent / https://client.karochebama.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName client.karochebama.local

    DocumentRoot /var/www/karochebama/frontend/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/client.karochebama.local/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/client.karochebama.local/privkey.pem

    <Directory /var/www/karochebama/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Support pour le routage de Single Page Application (React Router)
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/karochebama-frontend-error.log
    CustomLog ${APACHE_LOG_DIR}/karochebama-frontend-access.log combined
</VirtualHost>

