        Require all granted
        
        # Support pour le routage de Single Page Application (React Router)
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/karochebama-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/karochebama-admin-access.log combined
</VirtualHost>
