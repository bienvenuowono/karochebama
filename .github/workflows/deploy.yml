name: CI/CD Pipeline - KAROCHEBAMA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test (Backend & Frontends)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json
            admin/package.json

      # validation backend
      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./backend

      - name: Lint Backend
        run: npm run lint --if-present
        working-directory: ./backend

      # validation frontend
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Lint Frontend
        run: npm run lint --if-present
        working-directory: ./frontend

      # validation admin
      - name: Install Admin Dependencies
        run: npm ci
        working-directory: ./admin

      - name: Lint Admin
        run: npm run lint --if-present
        working-directory: ./admin

  build-and-deploy:
    name: Build & Zero-Downtime Deploy
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: 22
          script: |
            cd /var/www/karochebama
            
            # Récupérer les derniers changements
            git pull origin main
            
            # --- 1. DEPLOIEMENT BACKEND ---
            cd backend
            npm ci --only=production
            npm run build
            # Appliquer les migrations de base de données en production
            npx prisma migrate deploy
            npx prisma generate
            
            # --- 2. DEPLOIEMENT FRONTEND ---
            cd ../frontend
            npm ci
            npm run build
            
            # --- 3. DEPLOIEMENT ADMIN ---
            cd ../admin
            npm ci
            npm run build
            
            # --- 4. REDEMARRAGE DE L'API (Zero-Downtime reload) ---
            cd ..
            pm2 reload ecosystem.config.js --env production
