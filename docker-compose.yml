version: '3.8'

services:
  mysql:
    image: mysql:8.0.33
    container_name: gtk_mysql
    restart: always
    environment:
      MYSQL_DATABASE: karochebama
      MYSQL_USER: gtk_user
      MYSQL_PASSWORD: gtk_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gtk_network

  redis:
    image: redis:7.0-alpine
    container_name: gtk_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gtk_network

networks:
  gtk_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
